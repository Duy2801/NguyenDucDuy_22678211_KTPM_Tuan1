version: '3.9'

services:
  mariadb:
    image: mariadb:11
    container_name: mariadb-local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: product_db
    ports:
      - "3306:3306"
    volumes:
      - ./mariadb-init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    container_name: redis-local
    restart: always
    ports:
      - "6379:6379"