<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Product Management - CQRS Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-3xl font-bold">📦 Product Management</h1>
                        <p class="text-blue-100 mt-1">CQRS Architecture Demo with Redis & MariaDB</p>
                    </div>
                    <div class="text-right">
                        <div id="status" class="flex items-center gap-2">
                            <span class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></span>
                            <span>Connected</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Form Panel -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-lg shadow-lg p-6 sticky top-4">
                        <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                            <i class="fas fa-plus-circle text-blue-600"></i>
                            Add Product
                        </h2>
                        
                        <form id="productForm" class="space-y-4">
                            <!-- Product Name -->
                            <div>
                                <label class="block text-gray-700 font-semibold mb-2">
                                    Product Name
                                </label>
                                <input 
                                    type="text" 
                                    id="productName" 
                                    placeholder="Enter product name" 
                                    class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition"
                                    required
                                >
                            </div>

                            <!-- Product Price -->
                            <div>
                                <label class="block text-gray-700 font-semibold mb-2">
                                    Price (VND)
                                </label>
                                <input 
                                    type="number" 
                                    id="productPrice" 
                                    placeholder="Enter price" 
                                    class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition"
                                    required
                                >
                            </div>

                            <!-- Hidden ID for Edit Mode -->
                            <input type="hidden" id="productId">

                            <!-- Buttons -->
                            <div class="flex gap-2 pt-4">
                                <button 
                                    type="submit" 
                                    id="submitBtn"
                                    class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition transform hover:scale-105 flex items-center justify-center gap-2"
                                >
                                    <i class="fas fa-save"></i>
                                    Add Product
                                </button>
                                <button 
                                    type="button" 
                                    id="resetBtn"
                                    class="flex-1 bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-lg transition"
                                >
                                    <i class="fas fa-redo"></i>
                                </button>
                            </div>
                        </form>

                        <!-- Stats -->
                        <div class="mt-8 pt-6 border-t-2 border-gray-200">
                            <div class="text-center">
                                <div class="text-3xl font-bold text-blue-600" id="totalProducts">0</div>
                                <p class="text-gray-600 text-sm mt-1">Total Products</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Products List Panel -->
                <div class="lg:col-span-2">
                    <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                        <!-- Loading Skeleton -->
                        <div id="loadingSkeleton" class="divide-y">
                            <div class="p-6 animate-pulse">
                                <div class="flex justify-between items-start">
                                    <div class="flex-1">
                                        <div class="h-4 bg-gray-300 rounded w-1/3 mb-2"></div>
                                        <div class="h-3 bg-gray-200 rounded w-1/4"></div>
                                    </div>
                                    <div class="h-10 w-20 bg-gray-300 rounded"></div>
                                </div>
                            </div>
                            <div class="p-6 animate-pulse">
                                <div class="flex justify-between items-start">
                                    <div class="flex-1">
                                        <div class="h-4 bg-gray-300 rounded w-1/3 mb-2"></div>
                                        <div class="h-3 bg-gray-200 rounded w-1/4"></div>
                                    </div>
                                    <div class="h-10 w-20 bg-gray-300 rounded"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Products List -->
                        <div id="productsList" class="divide-y hidden">
                            <!-- Sản phẩm sẽ được render vào đây -->
                        </div>

                        <!-- Empty State -->
                        <div id="emptyState" class="p-12 text-center">
                            <i class="fas fa-inbox text-6xl text-gray-300 mb-4"></i>
                            <p class="text-gray-500 text-lg">No products yet</p>
                            <p class="text-gray-400 text-sm">Add your first product to get started</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-sm w-full p-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Edit Product</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Product Name</label>
                    <input 
                        type="text" 
                        id="editName" 
                        class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition"
                    >
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Price (VND)</label>
                    <input 
                        type="number" 
                        id="editPrice" 
                        class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition"
                    >
                </div>
            </div>

            <div class="flex gap-3 mt-6 pt-6 border-t">
                <button 
                    id="cancelEditBtn"
                    class="flex-1 bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-lg transition"
                >
                    Cancel
                </button>
                <button 
                    id="saveEditBtn"
                    class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition"
                >
                    Save
                </button>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="fixed top-4 right-4 z-50"></div>

    <script src="app.js"></script>
</body>
</html>
